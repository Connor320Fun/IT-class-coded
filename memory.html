<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Memory Match vs AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>.grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center;margin-top:12px}.card{width:80px;height:80px;border-radius:6px;background:#0b2;padding:10px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}</style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">Tic-Tac-Toe</a>
    <a href="connect.html">Connect Four</a>
    <a href="battleship.html">Battleship</a>
    <a href="hangman.html">Hangman</a>
    <a href="checkers.html">Checkers</a>
    <a href="chess.html">Chess</a>
    <a href="minesweeper.html">Minesweeper</a>
    <a href="snake.html">Snake</a>
    <a href="mastermind.html">Mastermind</a>
    <a href="rps.html">Rock Paper Scissors</a>
    <a href="2048.html">2048</a>
    <a href="pong.html">Pong</a>
    <a href="blackjack.html">Blackjack</a>
    <a href="memory.html">Memory Match</a>
    <a href="owner.html">Owner</a>
  </nav>
  <div class="app">
    <h1>Memory Match vs AI</h1>

    <div class="controls">
      <button id="mmNew" class="new-game">New Game</button>
    </div>

    <div class="scoreboard">
      <div>Player pairs: <span id="mmPlayerPairs">0</span></div>
      <div>AI pairs: <span id="mmAiPairs">0</span></div>
    </div>

    <div id="mmStatus" class="status">Press New Game</div>

    <div class="grid" id="mmGrid" style="margin-top:12px"></div>

    <!-- Admin -->
    <button id="mmAdminBtn" class="admin-btn">Admin Panel</button>
    <button id="mmOwnerBtn" class="owner-btn">Owner Panel</button>
    <div id="mmAdminPanel" class="admin-panel hidden">
      <h2>Admin Panel</h2>
      <div id="mmAdminAuth">
        <label>Enter code:</label>
        <input id="mmAdminPassword" type="password" />
        <button id="mmAdminUnlock">Unlock</button>
      </div>
      <div id="mmAdminContents" class="locked hidden">
        <label>Set difficulty:</label>
        <select id="mmAdminDifficulty">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
        <div>
          <button id="mmForcePlayerWin">Force Player Win</button>
          <button id="mmForceAiWin">Force AI Win</button>
        </div>
        <div>
          <button id="mmClearScores">Clear Scores</button>
          <button id="mmResetGame">Reset Game</button>
        </div>
        <h3>Logs</h3>
        <div id="mmAdminLogs" class="admin-logs"></div>
        <button id="mmCloseAdmin">Lock</button>
      </div>
    </div>
    <div id="mmOwnerPanel" class="admin-panel hidden">
      <h2>Owner Panel</h2>
      <div id="mmOwnerAuth">
        <label>Enter owner code:</label>
        <input id="mmOwnerPassword" type="password" />
        <button id="mmOwnerUnlock">Unlock</button>
      </div>
      <div id="mmOwnerContents" class="locked hidden">
        <h3>Game Control</h3>
        <div>
          <button id="mmOwnerNewGame">New Game</button>
          <button id="mmOwnerReloadApp">Reload App</button>
          <button id="mmOwnerKillSwitch">Kill Switch</button>
        </div>
        <h3>Game Outcomes</h3>
        <div>
          <button id="mmOwnerForcePlayerWin">Force Player Win</button>
          <button id="mmOwnerForceAiWin">Force AI Win</button>
        </div>
        <h3>LocalStorage</h3>
        <div>
          <button id="mmOwnerViewLS">View LocalStorage</button>
          <button id="mmOwnerClearLS">Clear LocalStorage</button>
        </div>
        <div id="mmOwnerLocalStorage" style="max-height:250px;overflow:auto;background:#111;color:#eee;padding:8px;border:1px solid #333;margin:8px 0;"></div>
        <h3>Admin Logs</h3>
        <div id="mmOwnerLogs" style="max-height:250px;overflow:auto;background:#111;color:#eee;padding:8px;border:1px solid #333;"></div>
        <button id="mmOwnerClose">Lock</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="memory.js"></script>
</body>
</html>
